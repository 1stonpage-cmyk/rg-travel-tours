<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover (BUG-079): without it, env(safe-area-inset-*) in
      index.css and FloatingWhatsApp.tsx resolves to 0px and the mobile
      bottom bar's safe-area padding is inert.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TravelSugbo — Cebu Day Tours &amp; Packages</title>
    <meta
      name="description"
      content="Book Cebu day tours and multi-day packages direct with TravelSugbo. Private vans, licensed drivers, pay a 30% deposit online."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No hero preload here (task 4.4b): this file is the shared SPA shell, so a
      preload in it is served on /tours, /privacy and /terms too, where the hero
      never renders — wasted bytes plus Chrome's "preloaded but not used"
      warning. The home resolver in server/src/seo/resolvers.ts emits it for /
      alone, through the same injector that writes the meta tags below.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
