<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover (BUG-079): without it, env(safe-area-inset-*) in
      index.css and FloatingWhatsApp.tsx resolves to 0px and the mobile
      bottom bar's safe-area padding is inert.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TravelSugbo — Cebu Day Tours &amp; Packages</title>
    <meta
      name="description"
      content="Book Cebu day tours and multi-day packages direct with TravelSugbo. Private vans, licensed drivers, pay a 30% deposit online."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Hero LCP preload — keep identical to the WebP <source> in HeroSection.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/hero/hero-cebu-800.webp 800w, /hero/hero-cebu-1920.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
